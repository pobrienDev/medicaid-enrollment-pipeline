# Local throwaway database:  docker compose up -d
# Reset it completely:        docker compose down -v
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: enrollment
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # applied automatically the first time the volume is created
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d enrollment"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
